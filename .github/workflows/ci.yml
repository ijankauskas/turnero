name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: turnero
          POSTGRES_PASSWORD: turnero
          POSTGRES_DB: turnero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnero -d turnero"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://turnero:turnero@localhost:5432/turnero?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build:shared
      - run: npm run db:generate
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run lint
      - run: npm test
